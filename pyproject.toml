[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpd-sima-gui"
version = "0.1.0"
description = "GTK system tray GUI for mpd-sima"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42.0",
    "pycairo>=1.20.0",
]

[project.scripts]
mpd-sima-gui = "mpd_sima_gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mpd_sima_gui*"]
